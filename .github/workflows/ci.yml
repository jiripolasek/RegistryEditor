name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build solution
        run: dotnet build JPSoftworks.Regedit.slnx -c Release -p:Platform=x64 -m:1 -nr:false

      - name: Run unit tests
        run: dotnet run --project tests/Regedit.Tests/Regedit.Tests.csproj -c Release --no-build
